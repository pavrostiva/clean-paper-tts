[project]
name = "clean-paper-tts"
version = "0.1.0"
description = "Convert scientific papers (PDF / HTML / MHTML) into clean HTML for text-to-speech reader apps"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pymupdf>=1.24",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pillow>=10.0",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
dev = ["pytest>=8.0"]

[project.scripts]
clean-paper-tts = "clean_paper_tts.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clean_paper_tts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
